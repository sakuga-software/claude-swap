name: Publish to npm

# A tag `ts-v<version>` publishes ts/ to npm. A GitHub release is not the
# trigger, because a release also starts the PyPI workflow of upstream.

on:
  push:
    tags: ["ts-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "ts-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: pnpm typecheck
      - run: pnpm test
      - run: npm publish --provenance --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
